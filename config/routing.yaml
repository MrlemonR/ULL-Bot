# Görev tipi → model grubu kuralları (spec §5.4).
#
# Faz 4: `app/router/classifier.py` her kullanıcı mesajını bir `task_type`e
# sokuyor (`trivial`, `tool_use`, `reasoning`, `long_context`, `code`,
# `vision`); `AgentLoop` bunu `selector.choose(task_type=...)`e veriyor.
# `task_type` altında blok yoksa `default`'a düşülüyor (`selector.py`
# `RoutingConfig.chain`) — o yüzden `default` hâlâ duruyor, dokunulmadı.
#
# `classification` için ayrı bir blok YOK: spec §5.1 bunu "local (her
# zaman)" diye tarif ediyor ama sınıflandırıcı hiç LLM çağırmıyor (bkz.
# classifier.py docstring, DECISIONS.md "Sınıflandırıcı kural tabanlı, LLM
# değil"), o yüzden yönlendirilecek bir model çağrısı yok.
#
# `model` alanları LiteLLM'deki `model_name`'ler (config/litellm.*.yaml).
# Orchestrator sağlayıcı SDK'sı bilmez, sadece bu soyut adları kullanır.
#
# Faz 5: `ollama` (chat-local, qwen2.5:3b-instruct — bkz. DECISIONS.md
# "Ollama entegrasyonu") `desktop.trivial`de önde, `desktop.tool_use`de son
# çare (spec §5.1 tablosu). `ENABLE_LOCAL=false` ya da Ollama kapalıysa
# `selector.evaluate()` onu otomatik eler (bkz. app/router/selector.py),
# zincirdeki sıradaki aday devreye girer — buraya ayrı bir kısayol
# eklenmedi. `laptop` profilinde local YOK (spec §5.1: "laptop profilinde
# local tamamen çıkarılır") — Faz 6'ya kadar bu profil ayrımı statik.

profiles:
  desktop:
    default:
      # Groq önde: hızlı ve günlük istek limiti geniş.
      - {provider: groq, model: chat-groq}
      # OpenRouter: model çeşidi en fazla olan, ama günlük 50 istek (kredi
      # alınmamış hesapta) — bu yüzden ikinci sırada.
      - {provider: openrouter, model: chat-openrouter}
      # Gemini: geniş context, kota bilgisi yalnızca yerel sayaçtan.
      - {provider: gemini, model: chat-gemini}

    # "Saat kaç", "merhaba" gibi kısa/fiilsiz istekler — spec §9 Faz 4 kabul
    # kriteri tam bu. Faz 5'in kabul kriteri ("internet kapalıyken bile
    # trivial işler çalışsın") `ollama` önde olduğu için sağlanıyor — kota
    # yok, API anahtarı istemiyor, tek koşul Ollama'nın ayakta olması.
    # `gemini_lite` (flash-lite, günde 500 istek) ikinci sırada (Faz 3'ün
    # ilk somut kazancı, DECISIONS.md "Gemini'nin iki modeli"), Groq son çare.
    trivial:
      - {provider: ollama, model: chat-local}
      - {provider: gemini_lite, model: chat-gemini-lite}
      - {provider: groq, model: chat-groq}

    # Ajan döngüsünün ara adımları (tool sonucu değerlendirme). Groq hızlı
    # ve zaten tool-calling'de sorunsuz çalışıyor (bkz. bilinen tool_use_failed
    # notu, NEXT_PHASE.md §5) — ara adımlar için en ucuz/hızlı seçenek.
    # `ollama` en sonda: spec §5.1 tablosunun son basamağı, gerçek internet
    # kesintisinde bile ajan döngüsü tamamen durmasın diye.
    tool_use:
      - {provider: groq, model: chat-groq}
      - {provider: openrouter, model: chat-openrouter}
      - {provider: ollama, model: chat-local}

    # Planlama, çok adımlı düşünme, analiz. OpenRouter'ın büyük ücretsiz
    # modeli önde (spec tablosu), Gemini yedek.
    reasoning:
      - {provider: openrouter, model: chat-openrouter}
      - {provider: gemini, model: chat-gemini}

    # Uzun döküman/log özetleme. Gemini'nin geniş context penceresi (250K
    # TPM) önde; OpenRouter yedek.
    long_context:
      - {provider: gemini, model: chat-gemini}
      - {provider: openrouter, model: chat-openrouter}

    # Script yazma/düzeltme. OpenRouter önde (spec tablosu), Groq yedek.
    code:
      - {provider: openrouter, model: chat-openrouter}
      - {provider: groq, model: chat-groq}

    # Görsel/ekran görüntüsü yorumlama. Şu an TEK aday: Gemini multimodal
    # destekliyor. Spec'in önerdiği ikinci aday (vision destekli bir
    # OpenRouter modeli) canlı doğrulanmadan eklenmedi (spec §12) — henüz bir
    # görsel eki özelliği de yok (bkz. classifier.py `has_image`, şu an hep
    # `False`). Görsel ekler eklendiğinde önce ikinci aday live-test edilmeli.
    vision:
      - {provider: gemini, model: chat-gemini}

  laptop:
    default:
      - {provider: groq, model: chat-groq}
      - {provider: openrouter, model: chat-openrouter}
      - {provider: gemini, model: chat-gemini}

    # Laptop'ta `ollama` bilinçli olarak YOK (spec §5.1) — aksi hâlde
    # laptop'ta hiç Ollama kurulu olmasa bile zincir onu aday sanıp
    # deneyecekti (`api_key_for` yerel için hep "var" döner). Faz 6'da LAN
    # üzerinden masaüstüne bağlanma opsiyonu eklenirse bu değişir.
    trivial:
      - {provider: gemini_lite, model: chat-gemini-lite}
      - {provider: groq, model: chat-groq}

    tool_use:
      - {provider: groq, model: chat-groq}
      - {provider: openrouter, model: chat-openrouter}

    reasoning:
      - {provider: openrouter, model: chat-openrouter}
      - {provider: gemini, model: chat-gemini}

    long_context:
      - {provider: gemini, model: chat-gemini}
      - {provider: openrouter, model: chat-openrouter}

    code:
      - {provider: openrouter, model: chat-openrouter}
      - {provider: groq, model: chat-groq}

    vision:
      - {provider: gemini, model: chat-gemini}

# Zincirdeki hiçbir sağlayıcı uygun değilse ne yapılacak:
#   error         -> kullanıcıya hata göster (varsayılan)
#   force_first   -> kotaya rağmen ilk adayı dene (429 riski göze alınır)
fallback_behaviour: force_first
