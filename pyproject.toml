[project]
name = "ull-bot"
version = "0.1.0"
description = "Kişisel AI Orkestratörü — ücretsiz model kotalarını yöneten, bilgisayarda iş yapan ajan"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.3",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "platformdirs>=4.2",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "litellm[proxy]>=1.44",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
