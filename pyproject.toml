[project]
name = "ull-bot"
version = "0.1.0"
description = "Kişisel AI Orkestratörü — ücretsiz model kotalarını yöneten, bilgisayarda iş yapan ajan"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic-settings>=2.4",
    "platformdirs>=4.2",
    "litellm[proxy]>=1.44",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
