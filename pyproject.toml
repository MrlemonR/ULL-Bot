[project]
name = "ull-bot"
version = "0.7.0"
description = "Lokal Ollama modelleriyle konuşmak için kişilik (master prompt) destekli sohbet arayüzü"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "psutil>=5.9",
]

[project.scripts]
ull-bot = "app.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
