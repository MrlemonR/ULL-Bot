<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ULL-Bot</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="chat">
    <header>
      <h1>ULL-Bot</h1>
      <span class="subtitle">Faz 3 — çoklu sağlayıcı</span>
      <span id="status-badges" class="badges"></span>
      <button id="quota-toggle" class="quota-toggle" type="button" title="Kota paneli">kota</button>
    </header>
    <section id="quota-panel" class="quota-panel" hidden>
      <div class="quota-head">
        <span>Sağlayıcı kotaları</span>
        <button id="quota-probe" type="button" class="quota-refresh">canlı sorgula</button>
      </div>
      <div id="quota-cards" class="quota-cards"></div>
    </section>
    <div id="chat-log" class="log"></div>
    <form id="chat-form" class="composer">
      <input id="chat-input" type="text" placeholder="Bir mesaj yaz..." autocomplete="off" />
      <button type="submit">Gönder</button>
    </form>
  </main>
  <script src="/static/app.js"></script>
</body>
</html>
