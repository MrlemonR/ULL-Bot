<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ULL-Bot</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">

    <!-- Sol şerit: bölüm seçimi -->
    <nav class="rail" id="rail" aria-label="Bölümler">
      <div class="rail-brand" title="ULL-Bot">U</div>

      <button class="rail-btn is-active" data-view="chat" type="button" title="Sohbet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.7L3 21l1.9-5A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
        <span>Sohbet</span>
      </button>

      <button class="rail-btn" data-view="mail" type="button" title="Mail">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
        <span>Mail</span>
        <b class="rail-badge" id="rail-mail-badge" hidden>0</b>
      </button>

      <button class="rail-btn" data-view="calendar" type="button" title="Takvim">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Takvim</span>
        <b class="rail-badge" id="rail-cal-badge" hidden>0</b>
      </button>

      <button class="rail-btn" data-view="quota" type="button" title="Kota">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Kota</span>
      </button>

      <button class="rail-btn" data-view="history" type="button" title="Geçmiş">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
        <span>Geçmiş</span>
      </button>

      <div class="rail-spacer"></div>

      <button class="rail-btn" data-view="settings" type="button" title="Ayarlar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        <span>Ayarlar</span>
      </button>
    </nav>

    <!-- Ana alan -->
    <main class="stage">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">Sohbet</h1>
          <p id="view-sub">Ajanla konuş — dosyalar, komutlar, mail ve takvim.</p>
        </div>
        <div class="topbar-right">
          <span class="chip" id="chip-dryrun" hidden>KURU ÇALIŞMA</span>
          <span class="chip chip-muted" id="chip-profile">—</span>
          <span class="chip chip-dot" id="chip-conn"><i></i><span>bağlanıyor</span></span>
        </div>
      </header>

      <div class="views">
        <!-- SOHBET -->
        <section class="view is-active" data-view="chat">
          <div class="chat-wrap">
            <div class="chat-log" id="chat-log"></div>
            <form class="composer" id="chat-form">
              <div class="composer-box">
                <textarea id="chat-input" rows="1" placeholder="Bir şey sor ya da yaptır… (Enter gönderir, Shift+Enter satır atlar)"></textarea>
                <button type="submit" id="chat-send" class="send-btn" title="Gönder">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 16-8-6 8 6 8z"/></svg>
                </button>
              </div>
              <div class="composer-hints" id="chat-hints">
                <button type="button" class="hint" data-prompt="Yeni mail var mı? Kontrol et ve kategorilerine göre özetle.">Mailleri kontrol et</button>
                <button type="button" class="hint" data-prompt="Bu hafta takvimimde ne var?">Bu hafta ne var</button>
                <button type="button" class="hint" data-prompt="Okunmamış toplantı maillerini bul ve takvime eklenmesi gerekenleri söyle.">Toplantıları bul</button>
              </div>
            </form>
          </div>
        </section>

        <!-- MAIL -->
        <section class="view" data-view="mail">
          <div class="split">
            <div class="split-main">
              <div class="mail-layout">
                <aside class="mail-side">
                  <button class="btn btn-primary btn-block" id="mail-sync">
                    <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
                    Senkronla
                  </button>
                  <div class="mail-search">
                    <input type="search" id="mail-search" placeholder="Mail ara…" />
                  </div>
                  <nav class="filters" id="mail-filters"></nav>
                  <button class="btn btn-ghost btn-block btn-sm" id="mail-ai-sort">
                    Kararsızları modele ayırt
                  </button>
                </aside>

                <div class="mail-list" id="mail-list"></div>

                <article class="mail-detail" id="mail-detail"></article>
              </div>
            </div>
            <div class="split-dock" id="dock-mail"></div>
          </div>
        </section>

        <!-- TAKVİM -->
        <section class="view" data-view="calendar">
          <div class="split">
            <div class="split-main">
              <div class="cal-layout">
                <div class="cal-main">
                  <div class="cal-head">
                    <div class="cal-nav">
                      <button class="icon-btn" id="cal-prev" title="Önceki ay">‹</button>
                      <h2 id="cal-title">—</h2>
                      <button class="icon-btn" id="cal-next" title="Sonraki ay">›</button>
                      <button class="btn btn-ghost btn-sm" id="cal-today">Bugün</button>
                    </div>
                    <div class="cal-actions">
                      <button class="btn btn-ghost btn-sm" id="cal-export">ICS indir</button>
                      <button class="btn btn-primary btn-sm" id="cal-new">+ Etkinlik</button>
                    </div>
                  </div>
                  <div class="cal-grid" id="cal-grid"></div>
                </div>
                <aside class="cal-side">
                  <div class="panel">
                    <h3>Seçili gün</h3>
                    <div id="cal-day"></div>
                  </div>
                  <div class="panel">
                    <h3>Takvime eklenmeyi bekleyen toplantılar</h3>
                    <div id="cal-pending"></div>
                  </div>
                </aside>
              </div>
            </div>
            <div class="split-dock" id="dock-calendar"></div>
          </div>
        </section>

        <!-- KOTA -->
        <section class="view" data-view="quota">
          <div class="pad">
            <div class="row-between">
              <p class="muted" id="quota-meta">—</p>
              <div>
                <button class="btn btn-ghost btn-sm" id="quota-refresh">Yenile</button>
                <button class="btn btn-ghost btn-sm" id="quota-probe">Canlı sorgula</button>
              </div>
            </div>
            <div class="cards" id="quota-cards"></div>
            <h3 class="section-h">Son 14 gün</h3>
            <div class="panel" id="usage-graph"></div>
          </div>
        </section>

        <!-- GEÇMİŞ -->
        <section class="view" data-view="history">
          <div class="pad">
            <div class="row-between">
              <input type="search" id="history-search" class="input-wide" placeholder="Tüm sohbetlerde ara…" />
              <button class="btn btn-ghost btn-sm" id="history-refresh">Yenile</button>
            </div>
            <div class="history-layout">
              <div class="history-list" id="history-list"></div>
              <div class="history-detail" id="history-detail"></div>
            </div>
          </div>
        </section>

        <!-- AYARLAR -->
        <section class="view" data-view="settings">
          <div class="pad" id="settings-body"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Onay diyaloğu (approval_request / continue_request) -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
