<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ULL-Bot</title>
  <link rel="stylesheet" href="/static/style.css" />
  <!-- Kullanıcının kendi teması. Dosya yoksa boş döner; en sonda yüklendiği
       için style.css'teki her şeyi ezebilir. Bkz. docs/TEMA.md -->
  <link rel="stylesheet" href="/theme.css" />
</head>
<body>
  <div class="app">

    <!-- Sol şerit: bölüm seçimi -->
    <nav class="rail" id="rail" aria-label="Bölümler">
      <div class="rail-brand" title="ULL-Bot">U</div>

      <button class="rail-btn is-active" data-view="chat" type="button" title="Sohbet">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.6-.7L3 21l1.9-5A8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5Z"/></svg>
        <span>Sohbet</span>
      </button>

      <button class="rail-btn" data-view="mail" type="button" title="Mail">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z"/><path d="m3 7 9 6 9-6"/></svg>
        <span>Mail</span>
        <b class="rail-badge" id="rail-mail-badge" hidden>0</b>
      </button>

      <button class="rail-btn" data-view="calendar" type="button" title="Takvim">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Takvim</span>
        <b class="rail-badge" id="rail-cal-badge" hidden>0</b>
      </button>

      <button class="rail-btn" data-view="automation" type="button" title="Otomasyon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="0"/><path d="M3 8h18M7 12h6M7 15h9"/></svg>
        <span>Otomasyon</span>
      </button>

      <button class="rail-btn" data-view="quota" type="button" title="Kota">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>Kota</span>
      </button>

      <div class="rail-spacer"></div>

      <button class="rail-btn" data-view="settings" type="button" title="Ayarlar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.9 19a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
        <span>Ayarlar</span>
      </button>
    </nav>

    <!-- Ana alan -->
    <main class="stage">
      <header class="topbar">
        <div class="topbar-title">
          <h1 id="view-title">[ SOHBET ]</h1>
          <p id="view-sub">Ajanla konuş — dosyalar, komutlar, mail ve takvim.</p>
        </div>
        <div class="topbar-right">
          <span class="chip" id="chip-dryrun" hidden>KURU ÇALIŞMA</span>
          <span class="chip chip-muted" id="chip-profile">—</span>
          <span class="chip chip-dot" id="chip-conn"><i></i><span>bağlanıyor</span></span>
          <!-- Geçmiş yalnızca Sohbet açıkken görünür (kullanıcı isteği):
               mail ya da takvimdeyken sohbet geçmişinin işi yok. -->
          <button class="chip chip-btn" id="chip-history" type="button" title="Sohbet geçmişi">
            [ GEÇMİŞ ]
          </button>
        </div>
      </header>

      <div class="views">
        <!-- SOHBET -->
        <section class="view is-active" data-view="chat">
          <div class="chat-wrap">
            <div class="chat-log" id="chat-log"></div>
            <form class="composer" id="chat-form">
              <div class="composer-box">
                <textarea id="chat-input" rows="1" placeholder="Bir şey sor ya da yaptır… (Enter gönderir, Shift+Enter satır atlar)"></textarea>
                <button type="submit" id="chat-send" class="send-btn" title="Gönder">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 12 16-8-6 8 6 8z"/></svg>
                </button>
              </div>
              <div class="composer-hints" id="chat-hints">
                <button type="button" class="hint" data-prompt="Yeni mail var mı? Kontrol et ve kategorilerine göre özetle.">Mailleri kontrol et</button>
                <button type="button" class="hint" data-prompt="Bu hafta takvimimde ne var?">Bu hafta ne var</button>
                <button type="button" class="hint" data-prompt="Okunmamış toplantı maillerini bul ve takvime eklenmesi gerekenleri söyle.">Toplantıları bul</button>
              </div>
            </form>
          </div>
        </section>

        <!-- MAIL -->
        <section class="view" data-view="mail">
          <div class="split">
            <div class="split-main">
              <div class="mail-layout">
                <!-- Kategori şeridi artık ÜSTTE (kullanıcı isteği): sol
                     kolon tamamen mail listesine kaldı ve sağdaki asistan
                     dock'u hiç daralmıyor. -->
                <div class="mail-topbar">
                  <div class="mail-tools">
                    <button class="btn btn-primary btn-sm" id="mail-sync">
                      <svg viewBox="0 0 24 24" class="ico"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 3v6h-6"/></svg>
                      Senkronla
                    </button>
                    <div class="mail-search">
                      <input type="search" id="mail-search" placeholder="mail ara…" />
                    </div>
                    <button class="btn btn-ghost btn-sm" id="mail-ai-sort">
                      Kararsızları modele ayırt
                    </button>
                  </div>
                  <!-- Seçim yokken kategoriler, seçim varken toplu işlemler. -->
                  <nav class="mail-tabs" id="mail-filters"></nav>
                  <div class="mail-bulk" id="mail-bulk" hidden></div>
                </div>

                <div class="mail-panes">
                  <div class="mail-list" id="mail-list"></div>
                  <article class="mail-detail" id="mail-detail"></article>
                </div>
              </div>
            </div>
            <div class="split-dock" id="dock-mail"></div>
          </div>
        </section>

        <!-- TAKVİM -->
        <section class="view" data-view="calendar">
          <div class="split">
            <div class="split-main">
              <div class="cal-layout">
                <div class="cal-main">
                  <div class="cal-head">
                    <div class="cal-nav">
                      <button class="icon-btn" id="cal-prev" title="Önceki ay">‹</button>
                      <h2 id="cal-title">—</h2>
                      <button class="icon-btn" id="cal-next" title="Sonraki ay">›</button>
                      <button class="btn btn-ghost btn-sm" id="cal-today">Bugün</button>
                    </div>
                    <div class="cal-actions">
                      <button class="btn btn-ghost btn-sm" id="cal-export">ICS indir</button>
                      <button class="btn btn-primary btn-sm" id="cal-new">+ Etkinlik</button>
                    </div>
                  </div>
                  <div class="cal-grid" id="cal-grid"></div>
                </div>
                <aside class="cal-side">
                  <div class="panel">
                    <h3>[ SEÇİLİ GÜN ]</h3>
                    <div id="cal-day"></div>
                  </div>
                  <div class="panel">
                    <h3>[ BEKLEYEN TOPLANTILAR ]</h3>
                    <div id="cal-pending"></div>
                  </div>
                </aside>
              </div>
            </div>
            <div class="split-dock" id="dock-calendar"></div>
          </div>
        </section>

        <!-- OTOMASYON -->
        <section class="view" data-view="automation">
          <div class="auto-layout">
            <!-- SOL: otomasyon seçimi + sohbet + adımlar -->
            <div class="auto-side">
              <div class="auto-picker">
                <select id="auto-select" class="auto-select"></select>
                <button class="btn btn-ghost btn-sm" id="auto-new" title="Yeni otomasyon">+</button>
                <button class="icon-btn" id="auto-edit" title="Ayarlar (ad, izinli siteler)">⚙</button>
                <button class="icon-btn" id="auto-del" title="Bu otomasyonu sil">&#10005;</button>
              </div>

              <div class="auto-chat" id="auto-chat"></div>

              <form class="auto-form" id="auto-form">
                <div class="composer-box">
                  <textarea id="auto-input" rows="2"
                    placeholder="Ne yapmasını istiyorsun? Örn: gelen maili aç, bilgileri al, tabloya gir"></textarea>
                  <button type="submit" class="send-btn" title="Planla">
                    <svg viewBox="0 0 24 24"><path d="m4 12 16-8-6 8 6 8z"/></svg>
                  </button>
                </div>
              </form>

              <div class="auto-steps-head">
                <span>[ ADIMLAR ]</span>
                <label class="auto-stepwise">
                  <input type="checkbox" id="auto-stepwise" checked>
                  <span class="box"></span> adım adım
                </label>
                <button class="btn btn-ghost btn-sm" id="auto-add-step" title="Elle adım ekle">+ Adım</button>
                <button class="btn btn-primary btn-sm" id="auto-run">Çalıştır</button>
                <button class="btn btn-ghost btn-sm" id="auto-stop" hidden>Durdur</button>
              </div>
              <div class="auto-steps" id="auto-steps"></div>
            </div>

            <!-- Sürüklenebilir ayırıcı: sol paneli büyütüp küçültmek için -->
            <div class="auto-splitter" id="auto-splitter" title="Sürükleyerek genişliği ayarla"></div>

            <!-- SAĞ: canlı tarayıcı -->
            <div class="auto-view">
              <div class="auto-toolbar">
                <button class="btn btn-primary btn-sm" id="auto-open">Tarayıcıyı aç</button>
                <input type="text" id="auto-url" class="auto-url" placeholder="https://mail.google.com" />
                <button class="btn btn-ghost btn-sm" id="auto-go">Git</button>
                <button class="btn btn-ghost btn-sm" id="auto-login" title="Görünür pencerede giriş yap">Giriş</button>
                <select id="auto-tabs" class="auto-tabs" title="Açık sekmeler"></select>
                <span class="chip chip-muted" id="auto-status">kapalı</span>
              </div>
              <div class="auto-screen" id="auto-screen">
                <img id="auto-frame" alt="Canlı tarayıcı görüntüsü" hidden />
                <div class="auto-empty" id="auto-empty">
                  <p>Tarayıcı kapalı.</p>
                  <p class="muted">“Tarayıcıyı aç” de, sonra soldaki kutuya ne yapılacağını yaz.</p>
                </div>
              </div>
            </div>
          </div>
        </section>

        <!-- KOTA -->
        <section class="view" data-view="quota">
          <div class="pad">
            <div class="row-between">
              <p class="muted" id="quota-meta">—</p>
              <div>
                <button class="btn btn-ghost btn-sm" id="quota-refresh">Yenile</button>
                <button class="btn btn-ghost btn-sm" id="quota-probe">Canlı sorgula</button>
              </div>
            </div>
            <div class="cards" id="quota-cards"></div>
            <h3 class="section-h">Son 14 gün</h3>
            <div class="panel" id="usage-graph"></div>
          </div>
        </section>

        <!-- GEÇMİŞ -->
        <section class="view" data-view="history">
          <div class="pad">
            <div class="row-between">
              <input type="search" id="history-search" class="input-wide" placeholder="Tüm sohbetlerde ara…" />
              <button class="btn btn-ghost btn-sm" id="history-refresh">Yenile</button>
            </div>
            <div class="history-layout">
              <div class="history-list" id="history-list"></div>
              <div class="history-detail" id="history-detail"></div>
            </div>
          </div>
        </section>

        <!-- AYARLAR -->
        <section class="view" data-view="settings">
          <div class="pad" id="settings-body"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- Onay diyaloğu (approval_request / continue_request) -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script type="module" src="/static/js/app.js"></script>
</body>
</html>
